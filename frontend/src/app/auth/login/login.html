<div class="auth-wrapper">
  <div class="auth-card">
    <div class="trust-badge">🔒 Zero-Knowledge Encrypted — Your files, your keys</div>

    <h1 class="brand-title">SecureTransfer</h1>
    <h2 class="form-title">Sign In</h2>

    <div class="field-group">
      <label for="username">Username or Email</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        placeholder="Enter username or email..."
        autocomplete="username"
      />
    </div>

    <div class="field-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Enter password..."
          autocomplete="current-password"
        />
        <button type="button" class="toggle-btn" (click)="showPassword = !showPassword">
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>

    <div class="validation-zone" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button class="btn-primary" (click)="onSubmit()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In Securely' }}
    </button>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
